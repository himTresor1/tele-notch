# Builds the website (site/, an Astro project) and publishes it to GitHub Pages.
# Runs when the site changes on main. release.sh also starts it after publishing a release,
# so the Changelog and the version on the home page pick up the new release.
# (Not on: release: that runs from the tag, and the github-pages environment only deploys main.)
# One-time setup (done for himTresor1/tele-notch): repo Settings → Pages → Source: "GitHub Actions".
name: Landing page
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read     # lets the deploy step find the artifact the upload step made
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Upload and deploy run as separate jobs: the deploy step only finds the uploaded
  # site once the job that uploaded it has finished.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build
        working-directory: site
        env:
          ASTRO_TELEMETRY_DISABLED: 1
          GITHUB_TOKEN: ${{ github.token }}   # read the releases without hitting the anonymous rate limit
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
